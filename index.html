<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato Encontrado</title>
  <!-- Link do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden; /* impede scroll */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      text-align: center;
    }
    .profile img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00c853;
      margin-bottom: 15px;
    }
    .profile h2 {
      font-size: 22px;
      color: #333;
      margin-bottom: 10px;
    }
    .profile p {
      font-size: 18px;
      color: #666;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .button {
      background-color: #e8f5e9;
      border: none;
      color: #00c853;
      padding: 15px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background-color 0.3s, transform 0.2s;
      cursor: default;
    }
    .button:hover {
      background-color: #c8e6c9;
      transform: scale(1.03);
    }
    .button i {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="profile">
    <img id="profile-photo" src="" alt="Foto de Perfil">
    <h2>Contato Encontrado:</h2>
    <p id="phone-number"></p>
  </div>

  <div class="buttons">
    <div class="button">
      <i class="fas fa-phone"></i> Ligar
    </div>
    <div class="button">
      <i class="fas fa-video"></i> Vídeo
    </div>
    <div class="button">
      <i class="fas fa-search"></i> Pesquisar
    </div>
  </div>
</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    const phoneElement = document.getElementById('phone-number');
    const photoElement = document.getElementById('profile-photo');

    if (numero) {
      phoneElement.textContent = formatPhoneNumber(numero);
    } else {
      phoneElement.textContent = "(00) 00000-0000";
    }

    if (foto) {
      photoElement.src = foto;
    } else {
      photoElement.src = "https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png";
    }
  };
</script>

</body>
</html>

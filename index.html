<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato Encontrado</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    overflow: hidden;
    background: #f2f2f2;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .app-container {
    height: 100%;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    padding: 20px;
    box-sizing: border-box;
  }
  .profile {
    text-align: center;
  }
  .profile img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #00c853;
    margin-bottom: 10px;
  }
  .profile h1 {
    font-size: 20px;
    margin: 10px 0 5px;
    color: #333;
  }
  .profile p {
    font-size: 16px;
    color: #777;
    margin: 0;
  }
  .buttons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 20px;
  }
  .button {
    width: 100%;
    padding: 12px;
    background: white;
    border: 2px solid #00c853;
    color: #00c853;
    text-align: center;
    border-radius: 12px;
    font-weight: bold;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: default;
    transition: background 0.3s, color 0.3s;
  }
  .button:hover {
    background: #00c853;
    color: white;
  }
  .button i {
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="profile">
    <img id="profile-photo" src="https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png" alt="Foto de Perfil">
    <h1>Contato Encontrado:</h1>
    <p id="phone-number">(00) 00000-0000</p>
  </div>

  <div class="buttons">
    <div class="button"><i class="fas fa-phone"></i> Ligar</div>
    <div class="button"><i class="fas fa-video"></i> Vídeo</div>
    <div class="button"><i class="fas fa-search"></i> Pesquisar</div>
  </div>
</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    if (numero) {
      document.getElementById('phone-number').textContent = formatPhoneNumber(numero);
    }
    if (foto) {
      document.getElementById('profile-photo').src = foto;
    }
  };
</script>

</body>
</html>

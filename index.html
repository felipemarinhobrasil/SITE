<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contato Encontrado</title>
  <!-- Link do Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 50px;
    }
    .profile {
      text-align: center;
      margin-bottom: 30px;
    }
    .profile img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #ccc;
    }
    .profile h2 {
      margin-top: 15px;
      font-size: 24px;
    }
    .profile p {
      color: #666;
      margin: 5px 0;
    }
    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .button {
      background-color: white;
      border: 2px solid #00c853;
      color: #00c853;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: default; /* Botões visuais apenas */
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.3s;
      text-decoration: none; /* Remove qualquer sublinhado */
    }
    .button:hover {
      background-color: #00c853;
      color: white;
    }
    .button i {
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="profile">
  <img id="profile-photo" src="" alt="Foto de Perfil">
  <h2>Contato Encontrado:</h2>
  <p id="phone-number"></p>
</div>

<div class="buttons">
  <div class="button">
    <i class="fas fa-phone"></i> Ligar
  </div>
  <div class="button">
    <i class="fas fa-video"></i> Vídeo
  </div>
  <div class="button">
    <i class="fas fa-search"></i> Pesquisar
  </div>
</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    const phoneElement = document.getElementById('phone-number');
    const photoElement = document.getElementById('profile-photo');

    if (numero) {
      phoneElement.textContent = formatPhoneNumber(numero);
    } else {
      phoneElement.textContent = "(00) 00000-0000";
    }

    if (foto) {
      photoElement.src = foto;
    } else {
      photoElement.src = "https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png";
    }
  };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato Encontrado</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #f2f2f2;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  .app-container {
    height: 100%;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 15px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
  }
  .profile {
    text-align: center;
  }
  .profile img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #00c853;
    margin-bottom: 15px;
  }
  .profile h1 {
    font-size: 20px;
    margin: 10px 0 5px;
    color: #333;
  }
  .profile p {
    font-size: 16px;
    color: #777;
    margin: 0 0 20px;
  }
  .loader {
    width: 80%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
  }
  .loader-bar {
    height: 100%;
    width: 0%;
    background: #00c853;
    animation: loading 2s infinite;
  }
  @keyframes loading {
    0% { width: 0%; }
    50% { width: 100%; }
    100% { width: 0%; }
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="profile">
    <img id="profile-photo" src="https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png" alt="Foto de Perfil">
    <h1>Contato Encontrado:</h1>
    <p id="phone-number">(00) 00000-0000</p>
  </div>

  <div class="loader">
    <div class="loader-bar"></div>
  </div>

  <p style="margin-top: 15px; font-size: 16px; color: #555;">Analisando os dados...</p>
</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    if (numero) {
      document.getElementById('phone-number').textContent = formatPhoneNumber(numero);
    }
    if (foto && foto!="null") {
      document.getElementById('profile-photo').src = foto;
    }
  };
</script>

</body>
</html>

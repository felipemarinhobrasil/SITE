<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato Encontrado</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #ece5dd;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  .app-container {
    height: auto;
    width: 100%;
    max-width: 400px;
    margin: 0px auto 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  .profile {
    text-align: center;
    margin-top: 20px;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
  .profile img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #25d366;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .profile h1 {
    font-size: 18px;
    margin: 10px 0 5px;
    color: #333;
  }
  .profile p {
    font-size: 18px;
    color: #555;
    margin: 5px 0 15px;
  }
  .loader {
    width: 80%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
  }
  .loader-bar {
    height: 100%;
    width: 0%;
    background: #25d366;
    animation: loading 2s infinite;
  }
  @keyframes loading {
    0% { width: 0%; }
    50% { width: 100%; }
    100% { width: 0%; }
  }
  .info-text {
    margin-top: 20px;
    font-size: 16px;
    color: #777;
    text-align: center;
  }
</style>
</head>
<body>

<div class="app-container">

  <div class="profile" id="profile-container">
    <img id="profile-photo" src="https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png" alt="Foto de Perfil">
    <h1>Contato Encontrado:</h1>
    <p id="phone-number">(00) 00000-0000</p>
  </div>

  <div class="loader" id="loader">
    <div class="loader-bar"></div>
  </div>

  <p class="info-text" id="info-text">Analisando os dados...</p>

</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    const profileContainer = document.getElementById('profile-container');
    const profilePhoto = document.getElementById('profile-photo');
    const phoneNumber = document.getElementById('phone-number');
    const loader = document.getElementById('loader');
    const infoText = document.getElementById('info-text');
    const fotoPadrao = "https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png";

    profileContainer.style.opacity = 0;

    setTimeout(() => {
      if (numero) {
        phoneNumber.textContent = formatPhoneNumber(numero);
      }
      if (foto && foto !== "null") {
        profilePhoto.src = decodeURIComponent(foto);
      } else {
        profilePhoto.src = fotoPadrao;
      }

      loader.style.display = 'none';
      infoText.style.display = 'none';
      profileContainer.style.opacity = 1;
    }, 2500);
  };
</script>

</body>
</html>

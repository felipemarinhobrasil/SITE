<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato Encontrado</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 320px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .profile img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #00c853;
      margin-bottom: 15px;
    }
    .profile h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }
    .profile p {
      font-size: 16px;
      color: #666;
      margin-bottom: 20px;
    }
    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .button {
      width: 100%;
      background-color: white;
      border: 2px solid #00c853;
      color: #00c853;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: default;
      transition: 0.3s;
    }
    .button:hover {
      background-color: #00c853;
      color: white;
    }
    .button i {
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="profile">
      <img id="profile-photo" src="" alt="Foto de Perfil">
      <h2>Contato Encontrado:</h2>
      <p id="phone-number"></p>
    </div>

    <div class="buttons">
      <div class="button">
        <i class="fas fa-phone"></i> Ligar
      </div>
      <div class="button">
        <i class="fas fa-video"></i> Vídeo
      </div>
      <div class="button">
        <i class="fas fa-search"></i> Pesquisar
      </div>
    </div>
  </div>
</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    const phoneElement = document.getElementById('phone-number');
    const photoElement = document.getElementById('profile-photo');

    if (numero) {
      phoneElement.textContent = formatPhoneNumber(numero);
    } else {
      phoneElement.textContent = "(00) 00000-0000";
    }

    if (foto) {
      photoElement.src = foto;
    } else {
      photoElement.src = "https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png";
    }
  };
</script>

</body>
</html>

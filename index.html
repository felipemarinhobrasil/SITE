<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato Encontrado</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #ece5dd; /* Fundo bege claro, igual o WhatsApp */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }
  .app-container {
    height: 100%;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: start;
    padding: 20px;
    box-sizing: border-box;
    border-radius: 0 0 15px 15px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    margin-top: 50px;
    overflow: hidden;
  }
  .header {
    width: 100%;
    background-color: #075E54;
    color: white;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    border-radius: 15px 15px 0 0;
  }
  .profile {
    text-align: center;
    margin-top: 20px;
  }
  .profile img {
    width: 130px;
    height: 130px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #25d366;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .profile h1 {
    font-size: 22px;
    margin: 10px 0 5px;
    color: #333;
  }
  .profile p {
    font-size: 18px;
    color: #555;
    margin: 5px 0 15px;
  }
  .loader {
    width: 80%;
    height: 10px;
    background: #ddd;
    border-radius: 5px;
    overflow: hidden;
    margin-top: 20px;
  }
  .loader-bar {
    height: 100%;
    width: 0%;
    background: #25d366;
    animation: loading 2s infinite;
  }
  @keyframes loading {
    0% { width: 0%; }
    50% { width: 100%; }
    100% { width: 0%; }
  }
  .info-text {
    margin-top: 20px;
    font-size: 16px;
    color: #777;
    text-align: center;
  }
  .btn-whatsapp {
    margin-top: 30px;
    padding: 12px 20px;
    background-color: #25d366;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    transition: background 0.3s;
    text-decoration: none;
    display: inline-block;
  }
  .btn-whatsapp:hover {
    background-color: #1ebe5b;
  }
</style>
</head>
<body>

<div class="header">
  Perfil WhatsApp
</div>

<div class="app-container">
  <div class="profile">
    <img id="profile-photo" src="https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png" alt="Foto de Perfil">
    <h1>Contato Encontrado:</h1>
    <p id="phone-number">(00) 00000-0000</p>
  </div>

  <div class="loader">
    <div class="loader-bar"></div>
  </div>

  <p class="info-text">Analisando os dados...</p>

  <a id="whatsapp-link" href="#" target="_blank" class="btn-whatsapp">Conversar no WhatsApp</a>
</div>

<script>
  function getParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      numero: params.get('numero'),
      foto: params.get('foto')
    };
  }

  function formatPhoneNumber(numero) {
    if (!numero || numero.length !== 11) return numero;
    return `(${numero.slice(0,2)}) ${numero.slice(2,7)}-${numero.slice(7)}`;
  }

  window.onload = function() {
    const { numero, foto } = getParams();
    const profilePhoto = document.getElementById('profile-photo');
    const fotoPadrao = "https://kevinreillycollection.com/wp-content/uploads/2015/08/profile-icon.png";
    const whatsappLink = document.getElementById('whatsapp-link');

    if (numero) {
      document.getElementById('phone-number').textContent = formatPhoneNumber(numero);
      whatsappLink.href = `https://wa.me/55${numero}`;
    } else {
      whatsappLink.style.display = "none"; // Se não tiver número, esconde o botão
    }

    if (foto && foto !== "null") {
      profilePhoto.src = decodeURIComponent(foto);
    } else {
      profilePhoto.src = fotoPadrao;
    }
  };
</script>

</body>
</html>
